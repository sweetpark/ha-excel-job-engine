server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:ha_excel_sample;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      # Ships inside the ha-excel-job-engine jar - no local copy needed.
      schema-locations: classpath:schema-h2.sql

mybatis:
  # Also ships inside the ha-excel-job-engine jar.
  mapper-locations: classpath:mapper/haexcel/*.xml
  configuration:
    map-underscore-to-camel-case: true

ha-excel:
  client-threshold: 10000
  job-ttl-minutes: 60
  worker-count: 2
  large-worker-count: 1
  zip-threshold: 100000
  chunk-size: 50000
  storage-type: LOCAL
  local-storage-path: ./sample-server-storage
  controller:
    enabled: true
