name: Auto Release & JitPack Deploy

on:
  push:
    branches:
      - main

jobs:
  auto-release:
    name: Semantic Release & Warm-up
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Next Semantic Version & Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: v
          default_bump: false
          release_branches: main

      - name: Set up JDK 17
        if: steps.tag_version.outputs.new_tag
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Validate Wrapper & Run Full Checks
        if: steps.tag_version.outputs.new_tag
        run: |
          chmod +x gradlew
          ./gradlew check --no-daemon

      - name: Create GitHub Release
        if: steps.tag_version.outputs.new_tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: |
            ${{ steps.tag_version.outputs.changelog }}

            ### 📦 의존성 추가 (JitPack)
            ```groovy
            repositories {
                mavenCentral()
                maven { url 'https://jitpack.io' }
            }

            dependencies {
                implementation 'com.github.sweetpark:ha-excel-job-engine:${{ steps.tag_version.outputs.new_tag }}'
            }
            ```
          generate_release_notes: true

      - name: Trigger JitPack Build Warm-up
        if: steps.tag_version.outputs.new_tag
        run: |
          TAG="${{ steps.tag_version.outputs.new_tag }}"
          echo "Triggering JitPack build for ${TAG}..."
          # `/api/builds/:groupId/:artifactId/:version` only reports build STATUS, it does not
          # start one - the old warm-up call hit that read-only endpoint with the wrong groupId
          # format on top (raw "sweetpark/ha-excel-job-engine" instead of the dotted
          # "com.github.sweetpark" JitPack expects), so it silently did nothing.
          # A build is actually triggered by requesting a real artifact coordinate (e.g. the POM).
          POM_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://jitpack.io/com/github/sweetpark/ha-excel-job-engine/${TAG}/ha-excel-job-engine-${TAG}.pom")
          echo "POM fetch (build trigger) HTTP status: ${POM_STATUS}"

          echo "Waiting for JitPack build to finish..."
          for i in $(seq 1 10); do
            sleep 15
            RESPONSE=$(curl -sS "https://jitpack.io/api/builds/com.github.sweetpark/ha-excel-job-engine/${TAG}")
            echo "${RESPONSE}"
            if echo "${RESPONSE}" | grep -q '"isTag" *: *true'; then
              echo "JitPack has resolved ${TAG} as a real tag - build is available (or in progress)."
              break
            fi
          done
